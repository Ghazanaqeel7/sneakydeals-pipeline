<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneaky Deals — Production desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#FFFFFF">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root{
  --bg:#F5F6F9; --bg2:#EEF1F5; --card:#FFFFFF; --card2:#F8F9FB; --line:#E5E8EF; --line2:#D5DAE4;
  --ink:#0F1729; --ink2:#465068; --ink3:#5F6880;
  --gold:#F2B134; --gold2:#8A5A00; --gold-bg:#FFF3D6;
  --coral:#C4372A; --coral-bg:#FDECEA; --mint:#0E7A54; --mint-bg:#E2F5EC;
  --blue:#1F4FE0; --blue-bg:#E8EEFF; --mute-bg:#EEF1F5;
  --r:16px; --r2:12px; --shadow:0 1px 2px rgba(15,23,41,.04),0 4px 16px rgba(15,23,41,.04);
  --display:"Instrument Serif",Georgia,serif; --sans:"Geist","Inter",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  --paper:var(--bg); --sheet:var(--card); --rule:var(--line2); --rule2:var(--line); --sig:var(--gold2); --sig-bg:var(--gold-bg);
  --ok:var(--mint); --ok-bg:var(--mint-bg); --bad:var(--coral); --bad-bg:var(--coral-bg); --info:var(--blue); --info-bg:var(--blue-bg);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--gold-bg)}
.mono{font-family:var(--mono)}
/* header */
.top{display:flex;align-items:center;gap:16px 24px;padding:12px 32px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.brand b{display:block;font:400 23px/1 var(--display);white-space:nowrap}
.brand span{display:block;font:500 10px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:1.3px;margin-top:4px}
.nav{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 auto}
.nav button{border:0;background:none;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:7px}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,41,.1)}
.nav .badge,.bnav .badge{background:var(--gold);color:#1A1203;border-radius:999px;font:600 11px var(--sans);padding:1px 7px}
.health{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;border:0;background:none;padding:6px 8px;border-radius:8px}
.health:hover{background:var(--bg2)}
.auth{display:flex;align-items:center;gap:8px}.auth .btn{white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink3);flex-shrink:0}
.dot.ok{background:#16A36B;box-shadow:0 0 0 3px var(--mint-bg)}.dot.warn{background:var(--gold);box-shadow:0 0 0 3px var(--gold-bg)}
.dot.bad{background:var(--coral);box-shadow:0 0 0 3px var(--coral-bg)}.dot.run{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.bnav{display:none}
/* page */
#main{max-width:1280px;margin:0 auto;padding:34px 32px 80px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.kicker{font:500 11px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--ink3)}
.lead{color:var(--ink2);font-size:16px;margin:8px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:12px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:116px;box-shadow:var(--shadow)}
.stat b{display:block;font:400 32px/1.1 var(--display)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}
.sec h2{font:500 11px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--ink3);margin:0}
.sec h2.hot{color:var(--gold2)}
.tgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.need{display:flex;gap:18px;padding:20px;margin-bottom:12px}
.need.urgent{border-color:#F0D08A;background:linear-gradient(180deg,#FFFCF4,#FFFFFF)}
.need .th{width:84px;height:112px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
.need .ic{width:84px;height:112px;border-radius:12px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.need .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.need .tt{font-size:19px;font-weight:600;line-height:1.3}
.need .ds{color:var(--ink2)}
.need .ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.allclear{display:flex;gap:12px;align-items:center;padding:18px 20px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--ink2);background:var(--card2)}
.next{padding:18px;display:flex;flex-direction:column;gap:14px}
.next .hd{display:flex;gap:12px;align-items:center}
.next .hd img{width:58px;height:78px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.prow span:first-child{display:flex;gap:9px;align-items:center;font-weight:500}
.prow .st2{font-size:12.5px;color:var(--ink2);text-align:right}
.prow .st2.ok{color:var(--mint)}.prow .st2.wait{color:var(--gold2)}
.prod{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.prod:last-child{border-bottom:0}
.prod:hover{background:var(--card2)}
.prod img{width:52px;height:70px;border-radius:9px;object-fit:cover;background:var(--bg2)}
.prod .tt{font-weight:600;font-size:15px;line-height:1.3}
.prod .nt{color:var(--ink2);font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px;max-width:420px}
.mini i{height:5px;border-radius:99px;background:var(--line)}
.mini i.done{background:#16A36B}.mini i.now{background:var(--ink)}.mini i.now.attn{background:var(--gold)}.mini i.now.err{background:var(--coral)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.col .ch{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13.5px;padding:2px 4px 4px}
.col .ch span{font:500 11px var(--mono);color:var(--ink3);background:var(--bg2);border-radius:999px;padding:1px 8px}
.bc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;min-width:0}
.bc:hover{border-color:var(--line2);background:var(--bg2)}
.bc img{width:32px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
.bc .bt{font-size:13px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc .bs{font-size:11.5px;color:var(--ink3);margin-top:3px}
.bc .bs.wait{color:var(--gold2);font-weight:500}.bc .bs.bad{color:var(--coral);font-weight:500}.bc .bs.work{color:var(--blue)}
.bc.plan{background:none;border-style:dashed;cursor:default}
.colempty{border:1px dashed var(--line2);border-radius:12px;padding:10px;font-size:12px;color:var(--ink3)}
.spark{display:block}
.vt{width:100%;border-collapse:collapse;font-size:13.5px}
.vt th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.vt th:first-child,.vt td:first-child{text-align:left}
.vt td{padding:12px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap;vertical-align:middle}
.vt td:first-child{font-family:var(--sans);white-space:normal}
.vt tr:last-child td{border-bottom:0}
.vt .vv{display:flex;gap:12px;align-items:center;min-width:240px}
.vt .vv img{width:40px;height:56px;border-radius:7px;object-fit:cover;flex-shrink:0;background:var(--bg2)}
.vt .vv a{color:var(--ink);font-weight:600;line-height:1.3}
.up{color:var(--mint)}.dim{color:var(--ink3)}
.ytline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:10px 0 0;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink2)}
.ytline b{color:var(--ink);font-family:var(--mono)}
.chartbox{padding:18px 20px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{padding:10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;line-height:1.35;min-height:78px}
.wd .d{color:var(--ink3);font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.6px}
.wd .x{margin-top:6px;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wd.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wd.long .d{color:var(--blue)}
.insight{padding:18px;display:flex;flex-direction:column;gap:10px}
.insight p{margin:0;font-size:15px;line-height:1.5}
/* videos */
.vids{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.vlist{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;box-shadow:var(--shadow);max-height:calc(100vh - 110px);overflow:auto}
.vlist .sect{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);padding:10px 10px 6px;display:flex;justify-content:space-between}
.btn.back{display:none}
.job{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:none;padding:8px;cursor:pointer;margin-bottom:2px;transition:background .15s}
.job:hover{background:var(--card2)}
.job.sel{background:var(--bg2);border-color:var(--line)}
.job .jt{width:44px;height:60px;border-radius:8px;object-fit:cover;background:var(--bg2)}
.job .id{font:11px var(--mono);color:var(--ink3)}
.job .t{font-weight:500;margin:1px 0 6px;line-height:1.3;font-size:13.5px}
.job .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.chip{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-wait{color:var(--gold2);background:var(--gold-bg)}.c-work{color:var(--blue);background:var(--blue-bg)}
.c-ok{color:var(--mint);background:var(--mint-bg)}.c-bad{color:var(--coral);background:var(--coral-bg)}.c-mute{color:var(--ink3);background:var(--mute-bg)}
.c-wait:before{animation:pulse 1.4s infinite}
.hero{display:grid;grid-template-columns:132px 1fr;gap:24px;align-items:end;margin-bottom:6px}
.hero .poster{width:132px;aspect-ratio:9/16;object-fit:cover;border-radius:14px;box-shadow:0 14px 30px rgba(15,23,41,.18);background:var(--bg2);cursor:zoom-in}
.eyebrow{font:500 11px var(--mono);color:var(--ink3);letter-spacing:.6px}
h1{font:400 40px/1.08 var(--display);margin:6px 0 12px;letter-spacing:.1px}
.sub{color:var(--ink2);display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px}
.track{display:grid;grid-template-columns:repeat(7,1fr);margin:26px 0 6px;position:relative}
.track:before{content:"";position:absolute;left:7%;right:7%;top:13px;height:2px;background:var(--line)}
.st{position:relative;text-align:center;font-size:12px;color:var(--ink3);padding-top:34px}
.st .n{position:absolute;left:50%;top:0;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line2);font:500 11px var(--mono);color:var(--ink3)}
.st.done{color:var(--ink2)}.st.done .n{background:var(--mint-bg);border-color:#16A36B;color:var(--mint)}
.st.now{color:var(--ink);font-weight:600}.st.now .n{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 0 0 6px rgba(15,23,41,.08)}
.st.now.attn .n{background:var(--gold);border-color:var(--gold);color:#1A1203;box-shadow:0 0 0 6px var(--gold-bg)}.st.now.attn{color:var(--gold2)}
.st.now.err .n{background:var(--coral);border-color:var(--coral);color:#fff}
.track-m{display:none}
.actionbar{margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.actionbar:has(+ .review),.actionbar:has(+ .waitbox){border-radius:var(--r) var(--r) 0 0}
.actionbar .msg{flex:1;min-width:260px}
.actionbar .msg b{display:block;font-size:15px;font-weight:600}
.actionbar .msg span{color:var(--ink2);font-size:13px}
.review{display:grid;grid-template-columns:minmax(220px,290px) minmax(160px,210px) 1fr;gap:24px;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);background:var(--card);padding:20px}
.hero .poster.wide{width:260px;aspect-ratio:16/9}
.review video.wide{aspect-ratio:16/9}
.lf-grid{display:grid;gap:14px}.lf-card{padding:16px}.lf-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lf-step{display:flex;gap:10px;margin:8px 0;font-size:14px;line-height:1.45}.lf-step b{color:var(--gold2);min-width:22px}
.lf-hook{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.lf-hook .t{font-weight:500}.lf-hook .m{font:11px var(--mono);color:var(--ink3);margin-top:3px}
.lf-copy{display:grid;gap:8px;margin-top:10px}.lf-copy .r{display:flex;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}.lf-copy .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.lf-thumb{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--bg2)}
.review video{width:100%;background:#000;border-radius:12px;display:block;aspect-ratio:9/16}
.review img{width:100%;border-radius:12px;display:block;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.review .vo{max-height:440px;overflow:auto;font:400 21px/1.5 var(--display);border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:18px 22px;color:var(--ink)}
.choice{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
.choice label{flex:1;padding:7px 8px;text-align:center;cursor:pointer;font-size:12.5px;border-radius:999px;color:var(--ink2)}
.choice input{display:none}
.choice label:has(input:checked){background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,23,41,.1)}
.waitbox{border:1px solid #F0D08A;border-top:0;border-radius:0 0 var(--r) var(--r);background:#FFFBF0;padding:14px 20px;font-size:13.5px;color:var(--ink2)}
.waitbox b{color:var(--gold2)}
.btn{border:1px solid var(--line2);background:var(--card);padding:9px 16px;cursor:pointer;font-weight:500;border-radius:999px;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);min-height:40px}
.btn:hover{background:var(--bg2);text-decoration:none}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.pri:hover{background:#26324D}
.btn.go{background:var(--gold);border-color:var(--gold);color:#1A1203;font-weight:600;box-shadow:0 6px 18px rgba(242,177,52,.28)}
.btn.go:hover{background:#E9A51F}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.danger{color:var(--coral);border-color:#F2C3BD;background:var(--card)}
.btn.sm{padding:5px 12px;font-size:12.5px;min-height:32px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.tabs{display:flex;gap:2px;margin-top:28px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 16px;cursor:pointer;color:var(--ink2);border-radius:999px;font-size:13px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(15,23,41,.1)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-top:14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lbl{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:1.1px;color:var(--ink3);margin:0 0 8px}
.log{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.log:before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:1px;background:var(--line)}
.log li{display:grid;grid-template-columns:84px 1fr;gap:26px;padding:9px 0;position:relative}
.log li:after{content:"";position:absolute;left:92px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--line2)}
.log li:first-child:after{border-color:var(--gold);background:var(--gold)}
.log time{font:11.5px var(--mono);color:var(--ink3);padding-top:2px}
.log img{max-width:170px;display:block;margin-top:8px;border-radius:10px;box-shadow:0 0 0 1px var(--line);cursor:zoom-in}
.md{max-width:780px;color:var(--ink)}
.md h1,.md h2,.md h3{font-family:var(--display);font-weight:400}
.md h1{font-size:28px}.md h2{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:30px}
.md table{border-collapse:collapse;font-size:12.5px;width:100%;margin:12px 0}
.md th,.md td{border-bottom:1px solid var(--line);padding:8px 8px;vertical-align:top;text-align:left}
.md th{color:var(--ink3);font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.8px}
.md code{font-family:var(--mono);font-size:12px;background:var(--bg2);padding:1px 5px;border-radius:5px}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line2);background:var(--card);padding:10px 12px;border-radius:10px;color:var(--ink)}
textarea::placeholder,input::placeholder{color:#8A92A6}
textarea:focus,input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,23,41,.08)}
textarea:disabled,input:disabled{background:var(--card2);color:var(--ink2)}
textarea.code{font:12.5px/1.6 var(--mono);min-height:520px}
.field{margin-bottom:16px}
.counter{font:11px var(--mono);color:var(--ink3);float:right}
.media video{width:100%;max-width:300px;background:#000;display:block;border-radius:12px}
.media img.thumb{width:100%;max-width:300px;display:block;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
audio{width:100%;border-radius:999px}

<body>
<header class="top">
  <div class="brand"><img src="logo.png" alt="Sneaky Deals logo"><div><b>Sneaky Deals</b><span>Production studio</span></div></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <button class="health" id="health" onclick="go('settings')" aria-label="System status"></button>
  <div class="auth" id="auth"></div>
</header>
<main id="main"><div class="empty">Loading pipeline…</div></main>
<nav class="bnav" id="bnav" aria-label="Main"></nav>
<div id="layer"></div>
<script>
const OWNER='Ghazanaqeel7', REPO='sneakydeals-pipeline', BR='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}`, RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BR}`;
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const S={state:null,runs:[],commits:[],feed:[],sel:null,tab:'progress',cache:{},editing:false,lastSync:null,view:'today',detail:false};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let TOKEN=store.get('sd_token');
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=(t)=>{if(!t)return'—';const s=(Date.now()-new Date(t))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'};
const etz=(t)=>t?new Date(t).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const pt2=(t)=>t?`${pkt(t)} PKT · ${etz(t)} US ET`:'—';
const pkt=(t,o={})=>t?new Date(t).toLocaleString('en-GB',{timeZone:'Asia/Karachi',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,...o}):'—';
const hm=(t)=>pkt(t,{day:undefined,month:undefined});
const b64d=(s)=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=(s)=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)};
function hdr(extra={}){const h={Accept:'application/vnd.github+json',...extra};if(TOKEN)h.Authorization='Bearer '+TOKEN;return h}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:hdr(opt.headers)});if(!r.ok){const t=await r.text();throw new Error(`GitHub ${r.status}: ${t.slice(0,160)}`)}return r.status===204?null:r.json()}
async function readText(path){
  if(TOKEN){const r=await fetch(`${API}/contents/${path}?ref=${BR}&t=${Date.now()}`,{headers:hdr({Accept:'application/vnd.github.raw'})});if(!r.ok)throw new Error(path+' '+r.status);return r.text()}
  const r=await fetch(`${RAW}/${path}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);return r.text();
}
async function readJson(path){const f=await api(`/contents/${path}?ref=${BR}&t=${Date.now()}`);return{text:b64d(f.content),sha:f.sha}}
async function writeFile(path,text,sha,message){return api(`/contents/${path}`,{method:'PUT',body:JSON.stringify({message,content:b64e(text),sha,branch:BR})})}
async function updateState(fn,message){
  for(let i=0;i<4;i++){
    const f=await readJson('state.json');const st=JSON.parse(f.text);
    if(fn(st)===false)return st;
    try{await writeFile('state.json',JSON.stringify(st,null,2)+'\n',f.sha,message);S.state=st;return st}
    catch(e){if(i===3||!String(e.message).includes('409'))throw e;await new Promise(r=>setTimeout(r,1200))}
  }
}
const nowIso=()=>new Date().toISOString().replace(/\.\d+Z$/,'Z');

// ---------- status model ----------
const STAGES=['Script','Your OK','Build','Render','Review','Scheduled','Live'];
const STAT={
  script_ready:[1,'Script waiting','wait',true],script_sent:[1,'Script — your call','wait',true],
  script_rejected:[0,'Script rewrite','work'],script_approved:[2,'Queued to build','work'],
  building:[2,'Building','work'],render_queued:[3,'Render queued','work'],rendering:[3,'Rendering','work'],
  render_failed:[3,'Render failed','bad',false,true],video_ready:[4,'Video waiting','wait',true],video_sent:[4,'Video — your call','wait',true],
  video_rejected:[2,'Fixing video','work'],video_approved:[5,'Scheduled','ok'],published:[6,'Live','ok'],dropped:[-1,'Dropped','mute'],
};
const info=(j)=>{if(j.type==='long'&&j.status==='video_approved')return[5,'Upload it yourself','wait',true];if(j.status==='published'&&j.live_at&&new Date(j.live_at)>new Date())return[5,'On YouTube · scheduled','ok'];return STAT[j.status]||[0,j.status,'mute']};
function chip(j){const [, label, c]=info(j);return `<span class="chip c-${c}">${esc(label)}</span>`}

function publishSlots(st){
  const days=(st.config&&st.config.publish_days)||['Mon','Wed','Fri','Sun'];
  const [hh,mm]=((st.config&&st.config.publish_time_pkt)||'05:00').split(':').map(Number);
  const queue=Object.entries(st.jobs).filter(([,j])=>j.status==='video_approved'&&j.type!=='long').sort((a,b)=>(a[1].updated||'').localeCompare(b[1].updated||''));
  const out={};let cursor=new Date();
  for(const [id] of queue){
    for(let d=0;d<21;d++){
      const k=new Date(cursor.getTime()+d*86400000);
      const pk=new Date(k.toLocaleString('en-US',{timeZone:'Asia/Karachi'}));
      const dayName=DAYS[pk.getDay()];
      const slotUtc=Date.UTC(pk.getFullYear(),pk.getMonth(),pk.getDate(),hh-5,mm);
      const taken=Object.values(st.jobs).some(j=>[j.live_at,j.published_at].some(t=>t&&Math.abs(new Date(t)-slotUtc)<12*3600000));
      if(days.includes(dayName)&&slotUtc>cursor.getTime()&&!taken){out[id]=new Date(slotUtc);cursor=new Date(slotUtc+60000);break}
    }
  }
  return out;
}

// ---------- loading ----------
async function load(){
  try{
    S.state=JSON.parse(await readText('state.json'));
    S.lastSync=new Date();
    S.n=(S.n||0)+1;const heavy=TOKEN||S.n%4===1;
    const [runs,commits,feed,own]=await Promise.allSettled([heavy?api('/actions/runs?per_page=6'):Promise.reject(0),heavy?api('/commits?per_page=40'):Promise.reject(0),readText('feed/youtube.xml'),readText('docs/research/own_videos.json')]);
    if(own.status==='fulfilled'){try{S.own=JSON.parse(own.value)}catch(e){}}
    try{S.social=JSON.parse(await readText('docs/research/social.json'))}catch(e){}
    if(runs.status==='fulfilled')S.runs=runs.value.workflow_runs||[];
    if(commits.status==='fulfilled')S.commits=commits.value||[];
    if(feed.status==='fulfilled')S.feed=parseFeed(feed.value);
    if(!String(S.sel).startsWith('__')&&(!S.sel||!S.state.jobs[S.sel])){const ids=Object.keys(S.state.jobs).filter(isJob);const open=ids.filter(i=>!['published','dropped'].includes(S.state.jobs[i].status));S.sel=(open.length?open:ids).slice(-1)[0]||null}
    render();
  }catch(e){const h=$('#health');if(h)h.innerHTML='<i class="dot bad"></i><span class="hl">Offline</span>';if(!S.state)$('#main').innerHTML=`<div class="empty">Could not read the pipeline: ${esc(e.message)}</div>`}
}
function parseFeed(x){const d=new DOMParser().parseFromString(x,'text/xml');return[...d.querySelectorAll('item')].map(i=>({title:i.querySelector('title')?.textContent,guid:i.querySelector('guid')?.textContent,date:i.querySelector('pubDate')?.textContent})).filter(i=>i.guid!=='setup-sample')}
function whoOf(c){const m=c.commit.message,a=c.commit.author.name;
  if(/^dashboard: /.test(m))return['you','You'];if(/^n8n: |^publish /.test(m))return['n8n','n8n'];
  if(a==='research-bot')return['render','Research'];if(/^Merge pull request/.test(m)||a===OWNER)return['you','You'];if(a==='render-bot'||/github-actions/.test(a))return['render','Render'];if(a==='claude-pipeline'||/claude/i.test(a))return['claude','Claude'];return['you',a]}

// ---------- render ----------
function sigOf(){const j=S.state&&S.state.jobs[S.sel];return JSON.stringify([S.view,S.detail,S.own&&S.own.updated,S.view==='today'&&S.state&&Object.entries(S.state.jobs).map(([k,v])=>k+v.status+(v.progress_count||0)+(v.updated||'')+(v.ig_at||'')).join(),S.view==='settings'&&S.commits.length&&S.commits[0].sha,S.sel,S.tab,!!TOKEN,j&&j.status,j&&j.updated,j&&j.progress_count,S.view==='settings'&&S.state&&[S.state.config,S.state.ideas],S.view==='calendar'&&Object.values(S.state.jobs).map(j=>j.status).join(),S.view==='long'&&[(S.state.config||{}).longform_enabled,(S.state.ideas||[]).length,Object.entries(S.state.jobs).filter(([k,v])=>v.type==='long').map(([k,v])=>k+v.status+(v.progress_count||0)).join()],S.view==='research'&&[S.rtab,S.rsort,(S.state.jobs.research||{}).progress_count,(S.state.ideas||[]).length]])}
function render(force){renderChrome();if(S.editing)return;const sg=sigOf();if(!force&&sg===S.sig)return;S.sig=sg;renderMain()}
const ICONS={
  today:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  videos:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  research:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',

function pipelineBoard(entries){
  const cols=[['script','Script'],['making','Making'],['review','Review'],['sched','Scheduled'],['live','Live']];
  const colOf=(j)=>{const s=j.status;if(s==='dropped')return null;
    if(['script_ready','script_sent','script_rejected'].includes(s))return'script';
    if(['script_approved','building','render_queued','rendering','render_failed','video_rejected'].includes(s))return'making';
    if(['video_ready','video_sent'].includes(s))return'review';
    if(s==='video_approved'||(s==='published'&&j.live_at&&new Date(j.live_at)>new Date()))return'sched';
    if(s==='published')return'live';return'making'};
  const slots=publishSlots(S.state);
  const sub=(id,j)=>{const s=j.status;
    if(s==='script_ready'||s==='script_sent')return['wait','Waiting on you'];
    if(s==='script_rejected')return['work','Claude is rewriting'];
    if(s==='video_ready'||s==='video_sent')return['wait','Waiting on you'];
    if(s==='render_failed')return['bad','Render failed — retrying'];
    if(s==='video_rejected')return['work','Fixing your notes'];
    if(s==='script_approved')return['work','Starts within the hour'];
    if(['building','render_queued','rendering'].includes(s)){const lp=(j.progress||[]).slice(-1)[0];return['work',info(j)[1]+(lp?' · '+ago(lp.t):'')]}
    if(slots[id])return['','Goes '+pkt(slots[id])];
    if(j.live_at)return['',(new Date(j.live_at)>new Date()?'Goes ':'Live ')+pkt(j.live_at)];
    return['',j.published_at?'Sent '+pkt(j.published_at):''];};
  const by={};cols.forEach(([k])=>by[k]=[]);
  entries.forEach(([id,j])=>{const c=colOf(j);if(c)by[c].push([id,j])});
  by.live.sort((a,b)=>(b[1].live_at||b[1].published_at||'').localeCompare(a[1].live_at||a[1].published_at||''));
  const card=([id,j],c)=>{const [cls,t]=sub(id,j);const img=c==='script'?'':`<img alt="" src="${RAW}/jobs/${esc(id)}/thumbnail.jpg?u=${encodeURIComponent(j.updated||'')}" onerror="this.onerror=null;this.src='logo.png'">`;
    return `<button class="bc" onclick="pick('${id}')">${img}<div style="min-width:0"><div class="bt">${esc(j.title||titleFromId(id))}</div><div class="bs ${cls}">${esc(t)}</div></div></button>`};
  const empty={script:'Claude writes the next one at 11:00',making:'Starts within an hour of your OK',review:'Nothing to watch',sched:'Approve a video to schedule it',live:'Nothing live yet'};
  return `<div class="board">${cols.map(([k,n])=>{const list=k==='live'?by[k].slice(0,4):by[k];
    return `<div class="col"><div class="ch">${n}<span>${by[k].length}</span></div>${list.map(e=>card(e,k)).join('')}${k==='script'?'<div id="b_plan"></div>':''}${!by[k].length&&k!=='script'?`<div class="colempty">${empty[k]}</div>`:''}${k==='live'&&by[k].length>4?`<a href="#" onclick="go('videos');return false" style="font-size:12.5px;padding:2px 4px">+${by[k].length-4} more</a>`:''}</div>`}).join('')}</div>`;
}

function spark(snaps,w=110,h=28,key='views'){const p=(snaps||[]).filter(x=>x[key]!=null).slice(-72);if(p.length<2)return'<span class="dim">—</span>';
  const vs=p.map(x=>x[key]),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  const pts=p.map((x,i)=>`${(i/(p.length-1)*w).toFixed(1)},${(h-2-(x[key]-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Views trend"><polyline points="${pts}" fill="none" stroke="#1F4FE0" stroke-width="1.8" stroke-linejoin="round"/></svg>`}
function bigChart(snaps,key,label){const p=(snaps||[]).filter(x=>x[key]!=null).slice(-200);
  if(p.length<2)return `<div class="empty" style="padding:24px 0">The ${label} chart fills in as hourly numbers come in.</div>`;
  const W=900,H=180,vs=p.map(x=>x[key]),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  const xy=p.map((x,i)=>[i/(p.length-1)*W,H-10-(x[key]-mn)/r*(H-30)]);
  const line=xy.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="${label} over time"><polygon points="0,${H} ${line} ${W},${H}" fill="#E8EEFF"/><polyline points="${line}" fill="none" stroke="#1F4FE0" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>
    <div style="display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3);margin-top:6px"><span>${pkt(p[0].t)}</span><span>${fmtN(mn)} → ${fmtN(mx)}</span><span>${pkt(p[p.length-1].t)}</span></div>`}

// ---- Earning goal (YouTube Partner Program) ----
// Tier 1 (fan funding): 500 subs + 3M Shorts views in 90 d (+3 uploads). Ads: 1,000 subs + 10M Shorts views in 90 d;
// new applicants from 1 Feb 2027 need 20M. Pace = growth over the hourly stats snapshots (min 1 day of data).
function earnGoal(){
  const O=S.own; if(!O||!O.channel)return null;
  const C=O.channel, snaps=(C.snaps||[]).filter(x=>x&&x.t);
  const subs=C.subs||0, vids=Object.values(O.videos||{});
  const views90=vids.reduce((a,v)=>a+((v.age_days==null||v.age_days<=90)?(v.views||0):0),0);
  const first=snaps[0], last=snaps[snaps.length-1]||{t:O.updated,subs,views:views90};
  const days=Math.max(1,first?(Date.parse(last.t)-Date.parse(first.t))/864e5:1);
  const subsPace=first?Math.max(0,(subs-(first.subs||0))/days):0;
  const v24=vids.reduce((a,v)=>a+(v.views_24h||0),0);
  const viewsPace=Math.max(v24, first?Math.max(0,(views90-(first.views||0))/days):0);
  const cut=Date.parse('2027-02-01T00:00:00Z');
  const mk=(name,subsT,viewsT,what)=>{
    const ps=Math.min(1,subs/subsT), pv=Math.min(1,views90/viewsT);
    const dS=subs>=subsT?0:(subsPace>0?(subsT-subs)/subsPace:Infinity);
    const reach90=viewsPace*90;                       // views in a 90-day window at today's pace
    const dV=views90>=viewsT?0:(reach90>=viewsT?(viewsT-views90)/viewsPace:Infinity);
    const d=Math.max(dS,dV);
    return {name,what,subsT,viewsT,ps,pv,pct:Math.min(ps,pv),eta:isFinite(d)?new Date(Date.now()+d*864e5):null,
      needViewsDay:Math.ceil(viewsT/90), needSubsDay:null, speedX:viewsPace>0?(viewsT/90)/viewsPace:null};
  };
  const t1=mk('Step 1: Fan funding',500,3e6,'Super Thanks, memberships, shopping');
  let t2=mk('Ad revenue (real earning)',1000,1e7,'Video ads + Premium share');
  if(!t2.eta||t2.eta.getTime()>=cut)t2=mk('Ad revenue (real earning)',1000,2e7,'Video ads + Premium share · 20M views for new channels from 1 Feb 2027');
  return {subs,views90,subsPace,viewsPace,days,t1,t2};
}

  cachedDaily('docs/research/news_hooks.json').then(H=>{S.hooks=H.hooks||[];const el=$('#lhooks');if(!el)return;
    el.innerHTML=`<div class="lbl">Today's news hooks (US + UK) · ${esc(hm(new Date(H.updated)))} PKT</div>`+(S.hooks.length?S.hooks.slice(0,12).map((h,i)=>`<div class="lf-hook"><div><div class="t">${esc(h.title)}</div><div class="m">${esc(h.source)} · ${esc(h.region)} · ${ago(h.date)}</div></div><button class="btn sm"${lock} onclick="queueHook(${i})">Make a long video on this</button></div>`).join(''):'<div class="empty">No strong hook found.</div>')}).catch(()=>{const el=$('#lhooks');if(el)el.innerHTML='<div class="lbl">News hooks</div><div class="empty">They appear here after the research run (daily 06:00 PKT).</div>'});
}
async function setLongFlag(v){if(!TOKEN)return askToken();try{await updateState(st=>{st.config=st.config||{};st.config.longform_enabled=v},'dashboard: long-form '+(v?'on':'off'));toast(v?'Long-form ON.':'Long-form OFF.');load()}catch(e){toast(e.message,true)}}
async function addLongIdea(){if(!TOKEN)return askToken();const t=$('#lidea').value.trim();if(!t)return;try{await updateState(st=>{st.ideas=st.ideas||[];st.ideas.push('[LONG] '+t)},'dashboard: add long idea');toast('Long idea queued for Claude.');load()}catch(e){toast(e.message,true)}}
async function queueHook(i){if(!TOKEN)return askToken();const h=(S.hooks||[])[i];if(!h)return;try{await updateState(st=>{st.ideas=st.ideas||[];st.ideas.push(`[LONG] ${h.title} | hook: ${h.url} | ${h.source} ${h.region}`)},'dashboard: long idea from news hook');toast('Queued — Claude backstory research karega.');load()}catch(e){toast(e.message,true)}}
async function fillHelper(id){
  const el=document.getElementById('uh-'+id);if(!el)return;const j=S.state.jobs[id]||{};let U=null;
  try{U=JSON.parse(await readText(`jobs/${id}/upload.json`))}catch(e){}
  if(!U){el.innerHTML='<div class="note">Upload data is not ready yet (it comes after the render).</div>';return}
  S.uh=S.uh||{};S.uh[id]={title:U.title,desc:U.description,tags:(U.tags||[]).join(', '),chap:(U.chapters||[]).join('\n'),pin:U.pinned_comment||''};
  const row=(k,l,v)=>`<div class="r"><div style="min-width:0"><b>${l}</b> <span>${esc(String(v).replace(/\n/g,' ').slice(0,70))}</span></div><button class="btn sm" onclick="copyUH('${esc(id)}','${k}')">Copy</button></div>`;
  const u=S.uh[id];
  el.innerHTML=`<div class="lbl">Upload helper</div><div class="note">YouTube Studio > Create > Upload > select the file, then copy-paste from below. The thumbnail is uploaded separately.</div>
   <div class="lf-row" style="margin:10px 0"><a class="btn pri" href="${esc(j.video_url||'#')}" target="_blank">⬇ Video file</a><a class="btn" href="${RAW}/jobs/${esc(id)}/thumbnail.jpg" target="_blank">🖼 Thumbnail</a><a class="btn" href="https://studio.youtube.com" target="_blank">YouTube Studio ↗</a></div>
   <div class="lf-copy">${row('title','Title',u.title)}${row('desc','Description (chapters + credits included)',u.desc)}${row('tags','Tags',u.tags)}${u.pin?row('pin','Pinned comment',u.pin):''}</div>
   <div class="lf-row" style="margin-top:14px"><button class="btn go"${TOKEN?'':' disabled'} onclick="markPublished('${esc(id)}')">Mark published</button><span class="note">Press after uploading.</span></div>`;
}
function copyUH(id,k){const u=(S.uh||{})[id];if(!u)return;const v={title:u.title,desc:u.desc,tags:u.tags,pin:u.pin,chap:u.chap}[k]||'';
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied.')).catch(()=>{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied.')}catch(e){toast('Copy failed — select it manually.',true)}t.remove()})}
async function markPublished(id){if(!TOKEN)return askToken();const url=prompt('YouTube video link (optional, can be left empty):','')||'';
  try{await updateState(st=>{const j=st.jobs[id];if(!j||j.status!=='video_approved')return false;j.status='published';j.published_at=nowIso();j.updated=j.published_at;if(url)j.yt_url=url;addNote(j,'✅ You uploaded the long video to YouTube and marked it published.')},`dashboard: ${id} published (manual upload)`);toast('Marked published.');load()}catch(e){toast(e.message,true)}}
async function addIdea(){S.editing=false;const t=$('#idea').value.trim();if(!t)return;try{await updateState(st=>{st.ideas=st.ideas||[];st.ideas.push(t)},'dashboard: add story idea');toast('Idea queued for Claude.');load()}catch(e){toast(e.message,true)}}
async function dropIdea(i){try{await updateState(st=>{(st.ideas||[]).splice(i,1)},'dashboard: remove story idea');load()}catch(e){toast(e.message,true)}}

try{if(matchMedia('(max-width:900px)').matches)$('#feedwrap').removeAttribute('open')}catch(e){}
{const hv=location.hash.slice(1);if(VIEWS.some(v=>v[0]===hv))S.view=hv}
load();setInterval(()=>{if(!document.hidden)load()},TOKEN?15000:45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</body>
