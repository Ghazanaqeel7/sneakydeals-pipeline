<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneaky Deals — Production desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#090c14">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root{
  --bg:#090c14; --bg2:#0d1220; --card:#121929; --card2:#172036; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#eef1f7; --ink2:#a7afc2; --ink3:#6b7489;
  --gold:#f2b134; --gold2:#ffd36e; --gold-bg:rgba(242,177,52,.12);
  --coral:#ef5b43; --coral-bg:rgba(239,91,67,.13); --mint:#3fcf8e; --mint-bg:rgba(63,207,142,.12);
  --blue:#5b8cff; --blue-bg:rgba(91,140,255,.13); --mute-bg:rgba(255,255,255,.05);
  --r:14px; --r2:10px;
  --display:"Instrument Serif",Georgia,serif; --sans:"Geist","Inter",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  /* legacy names used by markup */
  --paper:var(--bg); --sheet:var(--card); --rule:var(--line2); --rule2:var(--line); --sig:var(--gold); --sig-bg:var(--gold-bg);
  --ok:var(--mint); --ok-bg:var(--mint-bg); --bad:var(--coral); --bad-bg:var(--coral-bg); --info:var(--blue); --info-bg:var(--blue-bg);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 75% -10%,rgba(45,101,179,.18),transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--gold2);text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--gold);color:#111}
.mono{font-family:var(--mono)}
/* header */
.top{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:rgba(9,12,20,.82);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}
.brand{padding:12px 20px;display:flex;align-items:center;gap:12px;min-width:270px;border-right:1px solid var(--line)}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 0 1px var(--line2)}
.brand b{display:block;font:400 22px/1 var(--display);letter-spacing:.2px}
.brand span{display:block;font:500 10.5px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:1.4px;margin-top:4px}
.systems{display:flex;flex:1;overflow-x:auto;gap:0}
.sys{padding:11px 18px;border-right:1px solid var(--line);min-width:170px;white-space:nowrap}
.sys .k{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:1.1px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.sys .v{font-weight:500;margin-top:3px;font-size:13.5px}
.sys .s{color:var(--ink3);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--ink3)}
.dot.ok{background:var(--mint);box-shadow:0 0 0 3px var(--mint-bg)}.dot.warn{background:var(--gold);box-shadow:0 0 0 3px var(--gold-bg)}
.dot.bad{background:var(--coral);box-shadow:0 0 0 3px var(--coral-bg)}.dot.run{background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.auth{display:flex;align-items:center;gap:10px;padding:0 18px;border-left:1px solid var(--line)}
/* layout */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"jobs main" "feed main";min-height:calc(100vh - 62px)}
.a-jobs{grid-area:jobs}.a-feed{grid-area:feed}#main{grid-area:main;min-width:0}
aside{border-right:1px solid var(--line);background:rgba(13,18,32,.55);min-width:0}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.sect{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);padding:18px 18px 8px;display:flex;justify-content:space-between}
#jobs{padding:0 10px}
.job{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid transparent;border-radius:var(--r2);background:none;padding:9px 10px;cursor:pointer;margin-bottom:4px;transition:background .15s,border-color .15s}
.job:hover{background:rgba(255,255,255,.035)}
.job.sel{background:var(--card2);border-color:var(--line2);box-shadow:inset 3px 0 0 var(--gold)}
.job .jt{width:46px;height:64px;border-radius:7px;object-fit:cover;background:var(--card2);box-shadow:0 0 0 1px var(--line2)}
.job .id{font:11px var(--mono);color:var(--ink3)}
.job .t{font-weight:500;margin:1px 0 6px;line-height:1.3;font-size:13.5px}
.job .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.chip{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-wait{color:var(--gold2);background:var(--gold-bg)}.c-work{color:#8fb0ff;background:var(--blue-bg)}
.c-ok{color:var(--mint);background:var(--mint-bg)}.c-bad{color:#ff8a76;background:var(--coral-bg)}.c-mute{color:var(--ink3);background:var(--mute-bg)}
.c-wait:before{animation:pulse 1.4s infinite}
main{padding:28px 36px 70px;max-width:1240px}
/* hero */
.hero{display:grid;grid-template-columns:150px 1fr;gap:26px;align-items:end;margin-bottom:6px}
.hero .poster{width:150px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 1px var(--line2);background:var(--card2);cursor:zoom-in}
.eyebrow{font:500 11px var(--mono);color:var(--ink3);letter-spacing:.6px}
h1{font:400 38px/1.08 var(--display);margin:6px 0 12px;letter-spacing:.1px}
.sub{color:var(--ink2);display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;font-size:13px}
/* stepper */
.track{display:grid;grid-template-columns:repeat(7,1fr);margin:26px 0 6px;position:relative}
.track:before{content:"";position:absolute;left:7%;right:7%;top:13px;height:2px;background:var(--line2)}
.st{position:relative;text-align:center;font-size:12px;color:var(--ink3);padding-top:34px}
.st .n{position:absolute;left:50%;top:0;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1.5px solid var(--line2);font:500 11px var(--mono);color:var(--ink3)}
.st.done{color:var(--ink2)}.st.done .n{background:var(--card2);border-color:var(--mint);color:var(--mint)}
.st.now{color:var(--ink);font-weight:600}.st.now .n{background:var(--ink);border-color:var(--ink);color:#0b0f1a;box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.st.now.attn .n{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 6px var(--gold-bg)}.st.now.attn{color:var(--gold2)}
.st.now.err .n{background:var(--coral);border-color:var(--coral);color:#fff}
.track-m{display:none}
/* action + review */
.actionbar{margin:22px 0 0;border:1px solid var(--line2);border-radius:var(--r);background:linear-gradient(180deg,var(--card2),var(--card));padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.actionbar:has(+ .review),.actionbar:has(+ .waitbox){border-radius:var(--r) var(--r) 0 0}
.actionbar .msg{flex:1;min-width:260px}
.actionbar .msg b{display:block;font-size:15px;font-weight:600}
.actionbar .msg span{color:var(--ink2);font-size:13px}
.review{display:grid;grid-template-columns:minmax(220px,290px) minmax(160px,210px) 1fr;gap:24px;border:1px solid var(--line2);border-top:0;border-radius:0 0 var(--r) var(--r);background:var(--card);padding:20px}
.review video{width:100%;background:#000;border-radius:12px;display:block;aspect-ratio:9/16;box-shadow:0 0 0 1px var(--line2)}
.review img{width:100%;border-radius:12px;display:block;cursor:zoom-in;box-shadow:0 0 0 1px var(--line2)}
.review .vo{max-height:440px;overflow:auto;font:400 21px/1.5 var(--display);border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:18px 22px;color:#e6e9f2}
.choice{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:3px;margin-bottom:10px}
.choice label{flex:1;padding:7px 8px;text-align:center;cursor:pointer;font-size:12.5px;border-radius:999px;color:var(--ink2)}
.choice input{display:none}
.choice label:has(input:checked){background:var(--ink);color:#0b0f1a;font-weight:600}
.waitbox{border:1px solid rgba(242,177,52,.25);border-top:0;border-radius:0 0 var(--r) var(--r);background:linear-gradient(180deg,rgba(242,177,52,.08),rgba(242,177,52,.03));padding:14px 20px;font-size:13.5px;color:var(--ink2)}
.waitbox b{color:var(--gold2)}
/* buttons */
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.04);padding:9px 16px;cursor:pointer;font-weight:500;border-radius:999px;transition:all .15s;display:inline-block;color:var(--ink)}
.btn:hover{background:rgba(255,255,255,.09);text-decoration:none}
.btn.pri{background:var(--ink);color:#0b0f1a;border-color:var(--ink)}.btn.pri:hover{background:#fff}
.btn.go{background:linear-gradient(180deg,#ffcb5c,var(--gold));border-color:transparent;color:#1b1406;font-weight:600;box-shadow:0 8px 24px rgba(242,177,52,.25)}
.btn.go:hover{filter:brightness(1.06)}
.btn.danger{color:#ff8a76;border-color:rgba(239,91,67,.35);background:transparent}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
/* tabs + panels */
.tabs{display:flex;gap:4px;margin-top:28px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.tab{border:0;background:none;padding:7px 16px;cursor:pointer;color:var(--ink2);border-radius:999px;font-size:13px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card2);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.lbl{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:1.1px;color:var(--ink3);margin:0 0 8px}
/* timeline */
.log{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.log:before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.log li{display:grid;grid-template-columns:84px 1fr;gap:26px;padding:9px 0;position:relative}
.log li:after{content:"";position:absolute;left:92px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--ink3)}
.log li:first-child:after{border-color:var(--gold);background:var(--gold)}
.log time{font:11.5px var(--mono);color:var(--ink3);padding-top:2px}
.log img{max-width:170px;display:block;margin-top:8px;border-radius:10px;box-shadow:0 0 0 1px var(--line2);cursor:zoom-in}
/* markdown */
.md{max-width:780px;color:#dfe3ec}
.md h1,.md h2,.md h3{font-family:var(--display);font-weight:400}
.md h1{font-size:28px}.md h2{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:30px}
.md table{border-collapse:collapse;font-size:12.5px;width:100%;margin:12px 0}
.md th,.md td{border-bottom:1px solid var(--line);padding:8px 8px;vertical-align:top;text-align:left}
.md th{color:var(--ink3);font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.8px}
.md code{font-family:var(--mono);font-size:12px;background:var(--bg2);padding:1px 5px;border-radius:5px}
.md strong{color:var(--ink)}
/* forms */
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line2);background:var(--bg2);padding:10px 12px;border-radius:10px;color:var(--ink)}
textarea::placeholder,input::placeholder{color:var(--ink3)}
textarea:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-bg)}
textarea:disabled,input:disabled{opacity:.6}
textarea.code{font:12.5px/1.6 var(--mono);min-height:520px}
.field{margin-bottom:16px}
.counter{font:11px var(--mono);color:var(--ink3);float:right}
.media video{width:100%;max-width:300px;background:#000;display:block;border-radius:12px;box-shadow:0 0 0 1px var(--line2)}
.media img.thumb{width:100%;max-width:300px;display:block;border-radius:12px;box-shadow:0 0 0 1px var(--line2)}
audio{width:100%;filter:invert(.88) hue-rotate(180deg);border-radius:999px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.frames figure{margin:0}.frames img{width:100%;border-radius:10px;cursor:zoom-in;display:block;box-shadow:0 0 0 1px var(--line2)}
.frames figcaption{font:11px var(--mono);color:var(--ink3);margin-top:5px}
.kv{display:grid;grid-template-columns:150px 1fr}
.kv>div{padding:9px 0;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){color:var(--ink3);font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.8px;padding-top:12px}
.empty{color:var(--ink3);padding:26px 0}
/* activity */
.feed{list-style:none;margin:0;padding:0 10px 20px}
.feed li{display:grid;grid-template-columns:auto 1fr;column-gap:10px;padding:8px 8px;border-radius:8px;font-size:12.5px}
.feed li:hover{background:rgba(255,255,255,.03)}
.feed li>span:last-child{grid-column:1/-1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed time{font:11px var(--mono);color:var(--ink3)}
.who{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.8px}
.who.claude{color:var(--gold2)}.who.n8n{color:#8fb0ff}.who.render{color:var(--mint)}.who.you{color:var(--ink)}
/* overlays */
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#0b0f1a;padding:12px 16px;max-width:380px;z-index:20;font-size:13.5px;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.4);font-weight:500}
.toast.err{background:var(--coral);color:#fff}
.modal{position:fixed;inset:0;background:rgba(4,6,12,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:30}
.box{background:var(--card);border:1px solid var(--line2);width:min(560px,92vw);padding:24px;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.box h3{font:400 26px var(--display);margin:0 0 6px}
.box p{color:var(--ink2);margin:0 0 14px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}
.zoom img{max-width:92vw;max-height:92vh;border-radius:12px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.days label{border:1px solid var(--line2);padding:6px 12px;cursor:pointer;background:var(--bg2);border-radius:999px;font-size:13px}
.days label:has(input:checked){background:var(--gold-bg);border-color:rgba(242,177,52,.5);color:var(--gold2)}
.days input{display:none}
.note{font-size:12.5px;color:var(--ink3);padding:2px 0;margin:8px 0}
.note a{color:var(--gold2)}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.overview>div{padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.overview .big{font:400 44px/1 var(--display)}
.overview .lbl{margin-bottom:10px}
@media (max-width:900px){
  html,body{overflow-x:hidden;font-size:14px}
  .top{flex-wrap:wrap;position:static}
  .brand{min-width:0;flex:1;border-right:0;padding:12px 14px}
  .auth{border-left:0;padding:0 14px}
  .systems{order:3;flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);overflow:visible}
  .sys{min-width:0;white-space:normal;border-bottom:1px solid var(--line);padding:9px 14px}
  .sys:nth-child(2n){border-right:0}
  .sys .v{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sys .s{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"jobs" "main" "feed";grid-template-rows:auto}
  aside{border-right:0}
  .a-jobs{border-bottom:1px solid var(--line);padding-bottom:6px}
  .a-jobs .sect{padding:12px 16px 6px}
  #jobs{padding:0 8px}
  .a-feed{border-top:1px solid var(--line)}
  main{padding:20px 16px 40px}
  .hero{grid-template-columns:92px 1fr;gap:16px;align-items:center}
  .hero .poster{width:92px;border-radius:10px}
  h1{font-size:27px;margin:4px 0 8px}
  .track{display:none}
  .track-m{display:block;margin:18px 0 2px}
  .track-m .bar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .track-m .bar i{height:5px;border-radius:99px;background:var(--line2)}
  .track-m .bar i.done{background:var(--mint)}.track-m .bar i.now{background:var(--ink)}.track-m .bar i.now.attn{background:var(--gold)}.track-m .bar i.now.err{background:var(--coral)}
  .track-m .lab{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--ink3);margin-top:7px;text-transform:uppercase;letter-spacing:.6px}
  .actionbar{padding:14px 16px;margin-top:18px}
  .actionbar .msg{min-width:0}
  .actionbar .btn{flex:1;text-align:center}
  .review{grid-template-columns:1fr !important;padding:16px;gap:18px}
  .review video{max-height:72vh;width:auto;max-width:100%;margin:0 auto}
  .review .thumbwrap img{max-width:220px}
  .review .btn{width:100%;padding:13px}
  .review .vo{max-height:none;font-size:19px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;width:auto}
  .tabs::-webkit-scrollbar{display:none}
  .panel{padding:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .log:before{left:6px}.log li{grid-template-columns:1fr;gap:2px;padding-left:24px}.log li:after{left:2px}
  .log img{max-width:100%}
  .md table{display:block;overflow-x:auto}
  .kv{grid-template-columns:110px 1fr}
  .overview{grid-template-columns:1fr 1fr}
  .box{padding:18px}
  textarea.code{min-height:60vh}
}
.rv{display:grid;grid-template-columns:132px 1fr 74px 74px 74px 86px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rv img{width:132px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--bg2)}
.rv .t,.rc .t{color:var(--ink);font-weight:500;text-decoration:none;line-height:1.35}
.rv .m,.rc .m{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink3);font-size:12px;margin-top:6px}
.rn{text-align:right}.rn b{display:block;font:500 16px var(--mono)}.rn span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.rn b.hot{color:var(--gold2)}
.rsort{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink3);margin-bottom:6px}
.rc{padding:16px 0;border-bottom:1px solid var(--line)}.rch{display:flex;gap:12px;align-items:center}.rch img{width:44px;height:44px;border-radius:50%}
.rw{display:inline-block;margin:0 6px 8px 0;padding:5px 10px;border-radius:999px;background:var(--gold-bg);color:var(--gold2);font-size:13px}.rw i{font-style:normal;color:var(--ink3);margin-left:4px}
.rsug{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:8px}.rsug ul{margin:6px 0 0;padding-left:16px;color:var(--ink2);font-size:13px}.rsug li.hit{color:var(--mint)}
@media (max-width:900px){.rv{grid-template-columns:96px 1fr 58px 58px;gap:10px}.rv img{width:96px}.rv .rd{display:none}.rv>div:last-child{grid-column:2/5}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.png" alt=""><div><b>Sneaky Deals</b><span>Production desk</span></div></div>
  <div class="systems" id="systems"></div>
  <div class="auth" id="auth"></div>
</header>
<div class="layout">
  <aside class="a-jobs">
    <div class="sect"><span>Jobs</span><span id="sync" class="mono"></span></div>
    <div id="jobs"></div>
  </aside>
  <main id="main"><div class="empty">Loading pipeline…</div></main>
  <aside class="a-feed">
    <details id="feedwrap" open><summary class="sect"><span>Activity</span><span>all systems</span></summary>
    <ul class="feed" id="feed"></ul></details>
  </aside>
</div>
<div id="layer"></div>
<script>
const OWNER='Ghazanaqeel7', REPO='sneakydeals-pipeline', BR='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}`, RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BR}`;
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const S={state:null,runs:[],commits:[],feed:[],sel:null,tab:'progress',cache:{},editing:false,lastSync:null};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let TOKEN=store.get('sd_token');
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=(t)=>{if(!t)return'—';const s=(Date.now()-new Date(t))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'};
const pkt=(t,o={})=>t?new Date(t).toLocaleString('en-GB',{timeZone:'Asia/Karachi',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,...o}):'—';
const hm=(t)=>pkt(t,{day:undefined,month:undefined});
const b64d=(s)=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=(s)=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)};
function hdr(extra={}){const h={Accept:'application/vnd.github+json',...extra};if(TOKEN)h.Authorization='Bearer '+TOKEN;return h}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:hdr(opt.headers)});if(!r.ok){const t=await r.text();throw new Error(`GitHub ${r.status}: ${t.slice(0,160)}`)}return r.status===204?null:r.json()}
async function readText(path){
  if(TOKEN){const r=await fetch(`${API}/contents/${path}?ref=${BR}&t=${Date.now()}`,{headers:hdr({Accept:'application/vnd.github.raw'})});if(!r.ok)throw new Error(path+' '+r.status);return r.text()}
  const r=await fetch(`${RAW}/${path}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);return r.text();
}
async function readJson(path){const f=await api(`/contents/${path}?ref=${BR}&t=${Date.now()}`);return{text:b64d(f.content),sha:f.sha}}
async function writeFile(path,text,sha,message){return api(`/contents/${path}`,{method:'PUT',body:JSON.stringify({message,content:b64e(text),sha,branch:BR})})}
async function updateState(fn,message){
  for(let i=0;i<4;i++){
    const f=await readJson('state.json');const st=JSON.parse(f.text);
    if(fn(st)===false)return st;
    try{await writeFile('state.json',JSON.stringify(st,null,2)+'\n',f.sha,message);S.state=st;return st}
    catch(e){if(i===3||!String(e.message).includes('409'))throw e;await new Promise(r=>setTimeout(r,1200))}
  }
}
const nowIso=()=>new Date().toISOString().replace(/\.\d+Z$/,'Z');

// ---------- status model ----------
const STAGES=['Script','Your OK','Build','Render','Review','Scheduled','Live'];
const STAT={
  script_ready:[1,'Script waiting','wait',true],script_sent:[1,'Script — your call','wait',true],
  script_rejected:[0,'Script rewrite','work'],script_approved:[2,'Queued to build','work'],
  building:[2,'Building','work'],render_queued:[3,'Render queued','work'],rendering:[3,'Rendering','work'],
  render_failed:[3,'Render failed','bad',false,true],video_ready:[4,'Video waiting','wait',true],video_sent:[4,'Video — your call','wait',true],
  video_rejected:[2,'Fixing video','work'],video_approved:[5,'Scheduled','ok'],published:[6,'Live','ok'],dropped:[-1,'Dropped','mute'],
};
const info=(j)=>{if(j.status==='published'&&j.live_at&&new Date(j.live_at)>new Date())return[5,'On YouTube · scheduled','ok'];return STAT[j.status]||[0,j.status,'mute']};
function chip(j){const [, label, c]=info(j);return `<span class="chip c-${c}">${esc(label)}</span>`}

function publishSlots(st){
  const days=(st.config&&st.config.publish_days)||['Mon','Wed','Fri','Sun'];
  const [hh,mm]=((st.config&&st.config.publish_time_pkt)||'05:00').split(':').map(Number);
  const queue=Object.entries(st.jobs).filter(([,j])=>j.status==='video_approved').sort((a,b)=>(a[1].updated||'').localeCompare(b[1].updated||''));
  const out={};let cursor=new Date();
  for(const [id] of queue){
    for(let d=0;d<21;d++){
      const k=new Date(cursor.getTime()+d*86400000);
      const pk=new Date(k.toLocaleString('en-US',{timeZone:'Asia/Karachi'}));
      const dayName=DAYS[pk.getDay()];
      const slotUtc=Date.UTC(pk.getFullYear(),pk.getMonth(),pk.getDate(),hh-5,mm);
      const taken=Object.values(st.jobs).some(j=>[j.live_at,j.published_at].some(t=>t&&Math.abs(new Date(t)-slotUtc)<12*3600000));
      if(days.includes(dayName)&&slotUtc>cursor.getTime()&&!taken){out[id]=new Date(slotUtc);cursor=new Date(slotUtc+60000);break}
    }
  }
  return out;
}

// ---------- loading ----------
async function load(){
  try{
    S.state=JSON.parse(await readText('state.json'));
    S.lastSync=new Date();
    S.n=(S.n||0)+1;const heavy=TOKEN||S.n%4===1;
    const [runs,commits,feed]=await Promise.allSettled([heavy?api('/actions/runs?per_page=6'):Promise.reject(0),heavy?api('/commits?per_page=40'):Promise.reject(0),readText('feed/youtube.xml')]);
    if(runs.status==='fulfilled')S.runs=runs.value.workflow_runs||[];
    if(commits.status==='fulfilled')S.commits=commits.value||[];
    if(feed.status==='fulfilled')S.feed=parseFeed(feed.value);
    if(!String(S.sel).startsWith('__')&&(!S.sel||!S.state.jobs[S.sel])){const ids=Object.keys(S.state.jobs).filter(isJob);const open=ids.filter(i=>!['published','dropped'].includes(S.state.jobs[i].status));S.sel=(open.length?open:ids).slice(-1)[0]||null}
    render();
  }catch(e){$('#sync').textContent='offline';if(!S.state)$('#main').innerHTML=`<div class="empty">Could not read the pipeline: ${esc(e.message)}</div>`}
}
function parseFeed(x){const d=new DOMParser().parseFromString(x,'text/xml');return[...d.querySelectorAll('item')].map(i=>({title:i.querySelector('title')?.textContent,guid:i.querySelector('guid')?.textContent,date:i.querySelector('pubDate')?.textContent})).filter(i=>i.guid!=='setup-sample')}
function whoOf(c){const m=c.commit.message,a=c.commit.author.name;
  if(/^dashboard: /.test(m))return['you','You'];if(/^n8n: |^publish /.test(m))return['n8n','n8n'];
  if(a==='render-bot'||/github-actions/.test(a))return['render','Render'];if(a==='claude-pipeline'||/claude/i.test(a))return['claude','Claude'];return['you',a]}

// ---------- render ----------
function sigOf(){const j=S.state&&S.state.jobs[S.sel];return JSON.stringify([S.sel,S.tab,!!TOKEN,j&&j.status,j&&j.updated,j&&j.progress_count,S.sel==='__desk'&&S.state&&[S.state.config,S.state.ideas],S.sel==='__research'&&[S.rtab,S.rsort,(S.state.jobs.research||{}).progress_count,(S.state.ideas||[]).length]])}
function render(force){renderChrome();if(S.editing)return;const sg=sigOf();if(!force&&sg===S.sig)return;S.sig=sg;renderMain()}
function renderChrome(){
  const st=S.state;$('#sync').textContent=S.lastSync?'synced '+hm(S.lastSync):'';
  const lastBy=(k)=>S.commits.find(c=>whoOf(c)[0]===k);
  const cl=lastBy('claude'),n8=lastBy('n8n'),run=S.runs[0];
  const runState=run?(run.status!=='completed'?['run','Running']:run.conclusion==='success'?['ok','Passed']:['bad',run.conclusion]):['','—'];
  const live=S.feed[0];
  const nextBuild=Object.values(st.jobs).some(j=>['script_approved','render_failed','script_rejected','video_rejected'].includes(j.status));
  $('#systems').innerHTML=[
    ['Claude',cl?'ok':'warn',cl?'Last work '+ago(cl.commit.author.date):'No commits yet',nextBuild?'Has work queued — checks hourly':'Checks hourly · new story 11:00'],
    ['n8n → Slack',n8?'ok':'warn',n8?'Last write '+ago(n8.commit.author.date):'No writes yet','Polls every 1–2 min (laptop on)'],
    ['GitHub render',runState[0],run?`${runState[1]} · ${ago(run.updated_at)}`:'No runs',run?`<a href="${run.html_url}" target="_blank">open run ↗</a>`:''],
    ['Zapier → YouTube',live?'ok':'',live?esc(live.title).slice(0,26)+'…':'Nothing sent yet',live?'Handed over '+ago(live.date):`Next slot ${nextSlotText(st)}`],
  ].map(([k,d,v,s])=>`<div class="sys"><div class="k"><i class="dot ${d}"></i>${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  $('#auth').innerHTML=TOKEN?`<span class="chip c-ok">Edit on</span><button class="btn sm" onclick="signOut()">Lock</button>`:`<button class="btn sm pri" onclick="askToken()">Unlock editing</button>`;
  const ids=Object.keys(st.jobs).filter(isJob).reverse();
  const slots=publishSlots(st);
  $('#jobs').innerHTML=ids.map(id=>{const j=st.jobs[id];
    const when=slots[id]?'Goes live '+pkt(slots[id]):j.live_at?(new Date(j.live_at)>new Date()?'Goes live ':'Live since ')+pkt(j.live_at):j.published_at?'Sent '+pkt(j.published_at):'';
    return `<button class="job ${id===S.sel?'sel':''}" onclick="pick('${id}')"><img class="jt" loading="lazy" src="${RAW}/jobs/${esc(id)}/thumbnail.jpg?u=${encodeURIComponent(j.updated||'')}" onerror="this.style.visibility='hidden'"><div><div class="id">${esc(id)}</div><div class="t">${esc(j.title||titleFromId(id))}</div><div class="meta">${chip(j)}<span>${when}</span></div></div></button>`}).join('')
    +`<div style="padding:12px 16px;border-top:1px solid var(--rule2);display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ${S.sel==='__research'?'pri':''}" onclick="pick('__research')">🔎 Research</button><button class="btn sm" onclick="pick('__desk')">Desk settings &amp; story ideas</button></div>`;
  $('#feed').innerHTML=S.commits.slice(0,18).map(c=>{const [w,n]=whoOf(c);return `<li><time>${pkt(c.commit.author.date,{month:undefined})}</time><span class="who ${w}">${esc(n)}</span><span>${esc(c.commit.message.split('\n')[0]).slice(0,70)}</span></li>`}).join('');
}
const isJob=(id)=>/^\d/.test(id);
const titleFromId=(id)=>id.replace(/^\d+-/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function nextSlotText(st){const days=(st.config&&st.config.publish_days)||[];return days.join('/')+' '+((st.config&&st.config.publish_time_pkt)||'05:00')}
function pick(id){if(S.editing&&!confirm('Discard unsaved edits?'))return;S.editing=false;S.sel=id;S.tab='progress';render(true);window.scrollTo(0,0)}

function renderMain(){
  if(S.sel==='__desk')return renderDesk();
  if(S.sel==='__research')return renderResearch();
  const id=S.sel,j=S.state.jobs[id];if(!j){$('#main').innerHTML='<div class="empty">No jobs yet.</div>';return}
  const [idx,label,,attn,err]=info(j);const slots=publishSlots(S.state);
  const track=STAGES.map((s,i)=>`<div class="st ${i<idx?'done':''} ${i===idx?'now'+(attn?' attn':'')+(err?' err':''):''}"><div class="n">${i<idx?'✓':i+1}</div>${s}</div>`).join('');
  const lastP=(j.progress||[]).slice(-1)[0];
  $('#main').innerHTML=`
    <div class="hero"><img class="poster" src="${RAW}/jobs/${esc(id)}/thumbnail.jpg?u=${encodeURIComponent(j.updated||'')}" onclick="zoom(this.src)" onerror="this.style.visibility='hidden'"><div>
    <div class="eyebrow">${esc(id)}</div>
    <h1>${esc(j.title||titleFromId(id))}</h1>
    <div class="sub"><span>${chip(j)}</span><span>Updated ${ago(j.updated)}</span>${slots[id]?`<span style="color:var(--gold2)">Goes live ${pkt(slots[id])} PKT</span>`:''}${j.video_url?`<a href="${esc(j.video_url)}" target="_blank">Full-quality file ↗</a>`:''}</div></div></div>
    ${j.status==='dropped'?'':`<div class="track">${track}</div><div class="track-m"><div class="bar">${STAGES.map((x,i)=>`<i class="${i<idx?'done':''} ${i===idx?'now'+(attn?' attn':'')+(err?' err':''):''}"></i>`).join('')}</div><div class="lab"><span>Step ${idx+1} of 7 · ${STAGES[Math.max(idx,0)]}</span><span>${idx<6?'Next: '+STAGES[idx+1]:''}</span></div></div>`}
    ${actionBar(id,j,lastP)}
    ${reviewBlock(id,j)}
    <div class="tabs">${[['progress','Progress'],['script','Script'],['media','Voice · Video · Thumbnail'],['publish','YouTube details'],['frames','Check frames']].map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" onclick="setTab('${k}')">${n}</button>`).join('')}</div>
    <div class="panel" id="panel"><div class="empty">Loading…</div></div>`;
  renderTab();
}
function nextClaudeRun(){const d=new Date();d.setUTCMinutes(8,0,0);if(d<=new Date())d.setUTCHours(d.getUTCHours()+1);return d}
const LOCKED=()=>`<div class="lbl">Your decision</div><div class="note" style="margin:0 0 12px;color:var(--ink2)">To approve or ask for changes from here, unlock editing once on this device (paste your GitHub token). Until then you can still approve with ✅ in Slack.</div><button class="btn go" style="width:100%;padding:12px" onclick="askToken()">Unlock to approve</button>`;
function reviewBlock(id,j){
  const s=j.status,lock=!TOKEN?' disabled title="Unlock editing first"':'';
  if(s==='video_ready'||s==='video_sent'){
    const v=j.preview_url||j.video_url;
    return `<div class="review">
      <div><div class="lbl">Watch the video</div>${v?`<video controls playsinline preload="metadata" poster="${RAW}/jobs/${esc(id)}/thumbnail.jpg" src="${esc(v)}" onloadedmetadata="this.muted=false;this.volume=1"></video><div class="note">No sound? Click 🔊 in the player, or <a href="${esc(j.video_url||v)}" target="_blank">open the full file ↗</a> and play it on your laptop.</div>`:'<div class="empty">No video file.</div>'}</div>
      <div class="thumbwrap"><div class="lbl">Thumbnail</div><img src="${RAW}/jobs/${esc(id)}/thumbnail.jpg?u=${encodeURIComponent(j.updated||'')}" onclick="zoom(this.src)" onerror="this.outerHTML='<div class=empty>No thumbnail — the logo thumbnail would be used.</div>'"><div class="note" style="margin-top:10px">Video, thumbnail and the YouTube text are approved together.</div></div>
      <div>${!TOKEN?LOCKED():`<div class="lbl">Your decision</div>
        <button class="btn go" style="width:100%;padding:11px"${lock} onclick="decide('${id}','video_approved')">Approve video + thumbnail</button>
        <div class="note" style="margin:10px 0 12px">Goes out ${publishSlots(Object.assign({},S.state,{jobs:{...S.state.jobs,[id]:{...j,status:'video_approved',updated:'9999'}}}))[id]?'on '+pkt(publishSlots(Object.assign({},S.state,{jobs:{...S.state.jobs,[id]:{...j,status:'video_approved',updated:'9999'}}}))[id])+' PKT':'on the next publish slot'} if you approve now.</div>
        <div class="lbl" style="margin-top:6px">Or ask for changes</div>
        <div class="choice"><label><input type="radio" name="fx" value="thumbnail: " checked>Thumbnail only</label><label><input type="radio" name="fx" value="">Video</label></div>
        <textarea id="rv_fb" rows="5" oninput="dirty()" placeholder="Be specific — e.g. 'thumbnail: bigger DISNEY text, show the gator' or 'shot 5 at 0:21: the sign is cut off'"${lock}></textarea>
        <button class="btn pri" style="margin-top:8px"${lock} onclick="sendInline('${id}','video_rejected')">Send changes to Claude</button>
        <div class="note">Thumbnail-only changes do not re-render the video (~10 min). Video fixes need a new render (~1–2 h).</div>
      `}</div></div>`;
  }
  if(s==='script_ready'||s==='script_sent'){
    setTimeout(async()=>{try{const md=await cached(`jobs/${id}/script.md`);const m=md.split(/##\s*Voice-over/i)[1];const vo=m?m.split(/\n##\s/)[0].trim():'(open the Script tab)';const el=$('#rv_vo');if(el)el.textContent=vo;const w=$('#rv_wc');if(w)w.textContent=vo.split(/\s+/).length+' words · about '+Math.round(vo.split(/\s+/).length/170*60)+' s';}catch(e){}},0);
    return `<div class="review" style="grid-template-columns:1fr 340px">
      <div><div class="lbl">What the voice will say <span class="counter" id="rv_wc"></span></div><div class="vo" id="rv_vo">Loading…</div><div class="note">Shots, sources and the rulebook check are in the Script tab.</div></div>
      <div>${!TOKEN?LOCKED():`<div class="lbl">Your decision</div>
        <button class="btn go" style="width:100%;padding:11px"${lock} onclick="decide('${id}','script_approved')">Approve script</button>
        <div class="note" style="margin:10px 0 12px">Claude starts building in its next run (by ${hm(nextClaudeRun())} PKT). The video takes ~2 h after that.</div>
        <div class="lbl">Or ask for changes</div>
        <textarea id="rv_fb" rows="6" oninput="dirty()" placeholder="What should change? e.g. 'hook is weak — start with the fake company name'"${lock}></textarea>
        <button class="btn pri" style="margin-top:8px"${lock} onclick="sendInline('${id}','script_rejected')">Send changes to Claude</button>
        <button class="btn danger" style="margin-top:8px"${lock} onclick="askFeedback('${id}','dropped','Drop this story? Claude will pick a new one.',true)">Drop story</button>
      `}</div></div>`;
  }
  if((s==='script_rejected'||s==='video_rejected')){
    const note=(j.feedback||'').split('\n').slice(-1)[0].replace(/^\[[^\]]+\]\s*/,'');
    const since=(j.feedback||'').match(/\[([^\]]+)\][^\n]*$/);const after=(j.progress||[]).filter(p=>since&&p.t>=since[1]);
    return `<div class="waitbox"><b>Your note:</b> ${esc(note)||'—'}<br>${after.length?`Claude is working on it — latest: ${esc(after.slice(-1)[0].msg)}`:`Claude picks this up in its next run, by ${hm(nextClaudeRun())} PKT. Every step it takes shows up here and in Slack.`}</div>`;
  }
  return '';
}
function sendInline(id,next){const t=($('#rv_fb')||{}).value?.trim();if(!t)return toast('Write what should change first.',true);
  const pre=next==='video_rejected'?(document.querySelector('input[name=fx]:checked')||{}).value||'':'';doFeedback(id,next,pre+t)}
function actionBar(id,j,lastP){
  const s=j.status;let msg='',btns='';
  const lock=!TOKEN?' disabled title="Unlock editing first"':'';
  if(s==='script_ready'||s==='script_sent'){msg=`<b>The script is waiting for you.</b><span>Read the voice-over below (full shot list in the Script tab). Deciding here is the same as ✅ / ❌ in Slack.</span>`;
    btns=''}
  else if(s==='video_ready'||s==='video_sent'){msg=`<b>The video is ready for review.</b><span>Play it below, check the thumbnail, then approve or ask for changes. Same as ✅ / ❌ in Slack.</span>`;
    btns=''}
  else if(s==='script_rejected'||s==='video_rejected'){msg=`<b>Changes requested — Claude is on it.</b><span>${j.feedback?'Progress updates appear below and in Slack.':'Waiting for your note. Add one so Claude knows what to fix.'}</span>`;
    btns=j.feedback?'':`<button class="btn pri"${lock} onclick="askFeedback('${id}','${s}','What should change?')">Add note</button>`}
  else if(s==='video_approved'){msg=`<b>Approved and scheduled.</b><span>On the publish day at ${esc((S.state.config||{}).publish_time_pkt||'05:00')} PKT n8n hands it to Zapier, which uploads it to YouTube within ~15 min.</span>`;
    btns=`<button class="btn"${lock} onclick="unapprove('${id}')">Pull back to review</button>`}
  else if(s==='published'&&j.live_at&&new Date(j.live_at)>new Date()){msg=`<b>On YouTube, scheduled for ${pkt(j.live_at)} PKT.</b><span>It is uploaded and set to go public by itself. Pin this comment once it is live: <i id="pinned"></i></span>`;btns=`<a class="btn" href="https://studio.youtube.com" target="_blank">Open YouTube Studio ↗</a>`}
  else if(s==='published'){msg=`<b>Handed to YouTube.</b><span>Pin this comment once it is live: ${esc('')}<i id="pinned"></i></span>`;btns=`<a class="btn" href="https://studio.youtube.com" target="_blank">Open YouTube Studio ↗</a>`}
  else if(s==='render_failed'){msg=`<b>Render failed.</b><span>Claude retries in its next hourly run. ${j.render_error?esc(j.render_error):''}</span>`;btns=j.run?`<a class="btn" target="_blank" href="https://github.com/${OWNER}/${REPO}/actions/runs/${j.run}">See the log ↗</a>`:''}
  else if(s==='dropped'){msg=`<b>Dropped.</b><span>This story will not be made.</span>`}
  else{msg=`<b>${esc(info(j)[1])}…</b><span>${lastP?esc(lastP.msg)+' · '+ago(lastP.t):'Nothing to do — this updates live.'}</span>`}
  return `<div class="actionbar"><div class="msg">${msg}</div>${btns}</div>`;
}
function setTab(t){if(S.editing&&!confirm('Discard unsaved edits?'))return;S.editing=false;S.tab=t;S.sig=sigOf();renderMain()}

async function cached(path,kind='text'){
  const key=path+'|'+(S.state.jobs[S.sel]||{}).updated;if(S.cache[key])return S.cache[key];
  let v;if(kind==='json')v=JSON.parse(await readText(path));else v=await readText(path);S.cache[key]=v;return v}

async function renderTab(){
  const id=S.sel,j=S.state.jobs[id],P=$('#panel');
  try{
  if(S.tab==='progress'){
    const items=(j.progress||[]).slice().reverse();
    const fb=j.feedback?`<div class="lbl" style="margin-top:20px">Your notes</div><div class="note mono" style="white-space:pre-wrap">${esc(j.feedback)}</div>`:'';
    P.innerHTML=(items.length?`<ul class="log">${items.map(p=>`<li><time>${pkt(p.t,{month:undefined})}</time><div>${esc(p.msg)}${p.image?`<img loading="lazy" src="${RAW}/${esc(p.image)}" onclick="zoom(this.src)">`:''}</div></li>`).join('')}</ul>`:`<div class="empty">No progress notes yet. Claude posts one at every step of the build.</div>`)+fb

    </div><div>

// ---------- research ----------
const fmtN=(n)=>{n=n||0;return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n)};
const durT=(s)=>s>=3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function renderResearch(){
  S.rtab=S.rtab||'shorts';S.rsort=S.rsort||'smart';
  let R=null;try{R=JSON.parse(await readText('docs/research/latest.json'))}catch(e){}
  if(!R||!R.full_run){$('#main').innerHTML=`<h1>Research</h1><div class="sub">Free research bot: YouTube Data API + YouTube search suggestions, every Monday 06:00 PKT.</div>
    <div class="panel"><div class="lbl">Not run yet</div><p>The bot needs the free YouTube API key saved as the repo secret <b>YT_API_KEY</b>.
    Then open <a href="https://github.com/${OWNER}/${REPO}/actions/workflows/research.yml" target="_blank">Actions → research ↗</a> and press <b>Run workflow</b> (mode: full), or wait for Monday.</p></div>`;return}
  const o=R.own||{},ideas=S.state.ideas||[];
  const tabs=[['shorts','🔥 Viral Shorts ('+(R.shorts||[]).length+')'],['long','🎬 Viral long videos ('+(R.long||[]).length+')'],['comp','👀 Competitors ('+(R.competitors||[]).length+')'],['words','🏷 Hot words & searches'],['titles','✍️ Title check']];
  $('#main').innerHTML=`<h1>Research</h1>
  <div class="sub"><span>Last full scan ${ago(R.full_run)} (${pkt(R.full_run)} PKT)</span><span>Next: Monday 06:00 PKT</span><span>${R.units_used||0} of 10,000 free API units</span><a href="https://github.com/${OWNER}/${REPO}/actions/workflows/research.yml" target="_blank">Run now ↗</a></div>
  <div class="overview">
    <div><div class="lbl">Sneaky Deals subs</div><div class="big">${fmtN(o.subs)}</div><div class="note">${o.subs_change!=null?(o.subs_change>=0?'+':'')+o.subs_change+' since last scan':'first scan'}</div></div>
    <div><div class="lbl">Channel views</div><div class="big">${fmtN(o.views)}</div><div class="note">${o.views_change!=null?'+'+fmtN(o.views_change)+' since last scan':'&nbsp;'}</div></div>
    <div><div class="lbl">Hits found</div><div class="big">${(R.shorts||[]).length+(R.long||[]).length}</div><div class="note">US, English, last ${R.config.shorts.days} d Shorts / ${R.config.long.days} d long</div></div>
    <div><div class="lbl">Ideas queued</div><div class="big">${ideas.length}</div><div class="note">Claude uses them first</div></div>
  </div>
  <div class="note">How to read it: <b>x score</b> = views ÷ that channel's normal views. 20x on a small channel means the <i>topic</i> pulled the views, not the channel's size. Use these as topic signals — we always tell the story our own way, with our own facts check.</div>
  <div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${S.rtab===k?'on':''}" onclick="S.rtab='${k}';renderResearch()">${n}</button>`).join('')}</div>
  <div class="panel" id="rpanel"></div>`;
  const P=$('#rpanel');
  const idea=(v)=>TOKEN?`<button class="btn sm" onclick='addResearchIdea(${JSON.stringify(v.title+' — '+v.channel+' ('+fmtN(v.views)+' views, '+v.score+'x)')})'>➕ Idea</button>`:'';
  const inQ=(v)=>ideas.some(x=>x.startsWith(v.title));
  const vrow=(v)=>`<div class="rv"><a href="https://youtu.be/${esc(v.id)}" target="_blank"><img loading="lazy" src="${esc(v.thumb)}"></a><div class="rt">
     <a class="t" href="https://youtu.be/${esc(v.id)}" target="_blank">${esc(v.title)}</a>
     <div class="m"><span>${esc(v.channel)}${v.subs?' · '+fmtN(v.subs)+' subs':''}</span><span>${durT(v.seconds)}</span><span>${ago(v.published)}</span>${(v.keywords||[]).length?`<span>search: ${esc(v.keywords.join(', '))}</span>`:''}</div></div>
     <div class="rn"><b>${fmtN(v.views)}</b><span>views</span></div><div class="rn"><b class="${v.score>=10?'hot':''}">${v.score}x</b><span>breakout</span></div><div class="rn rd"><b>${fmtN(v.per_day)}</b><span>/ day</span></div>
     <div>${inQ(v)?'<span class="chip c-ok">queued</span>':idea(v)}</div></div>`;
  const sorter={smart:()=>0,score:(a,b)=>b.score-a.score,views:(a,b)=>b.views-a.views,new:(a,b)=>b.published.localeCompare(a.published),day:(a,b)=>b.per_day-a.per_day};
  const sortBar=`<div class="rsort">Sort: ${[['smart','Best'],['score','Breakout'],['views','Views'],['day','Views/day'],['new','Newest']].map(([k,n])=>`<button class="btn sm ${S.rsort===k?'pri':''}" onclick="S.rsort='${k}';renderResearch()">${n}</button>`).join('')}</div>`;
  if(S.rtab==='shorts'||S.rtab==='long'){
    const rows=(R[S.rtab]||[]).slice().sort(sorter[S.rsort]);
    P.innerHTML=sortBar+(rows.length?rows.map(vrow).join(''):'<div class="empty">Nothing found this week.</div>');
  }else if(S.rtab==='comp'){
    P.innerHTML=(R.competitors||[]).map(c=>`<div class="rc"><div class="rch"><img src="${esc(c.thumb)}" onerror="this.style.visibility='hidden'"><div><a class="t" href="https://youtube.com/channel/${esc(c.id)}" target="_blank">${esc(c.title)}</a>
      <div class="m"><span>${fmtN(c.subs)} subs${c.subs_change!=null?` (${c.subs_change>=0?'+':'-'}${fmtN(Math.abs(c.subs_change))} this week)`:''}</span><span>${c.uploads_30d} uploads / 30 d</span><span>${Math.round(c.shorts_share*100)}% Shorts</span><span>normal video: ${fmtN(c.recent_median)} views</span><span>last upload ${ago(c.last_upload)}</span></div></div></div>
      ${(c.hits||[]).length?`<div class="lbl" style="margin-top:12px">Recent hits (3x+ their normal)</div>${c.hits.map(vrow).join('')}`:`<div class="note">No recent video beat their normal by 3x.</div>`}</div>`).join('')||'<div class="empty">No competitors set (research/config.json).</div>';
  }else if(S.rtab==='words'){
    const chips=(a)=>(a||[]).map(w=>`<span class="rw">${esc(w.word)} <i>${w.count}</i></span>`).join('')||'<span class="note">—</span>';
    P.innerHTML=`<div class="lbl">Words that keep showing up in viral Shorts titles</div><div>${chips(R.hot_words&&R.hot_words.shorts)}</div>
      <div class="lbl" style="margin-top:18px">…and in viral long videos</div><div>${chips(R.hot_words&&R.hot_words.long)}</div>
      <div class="lbl" style="margin-top:22px">What people type into YouTube search (US)</div>
      <div class="rsug">${Object.entries(R.suggestions||{}).map(([q,a])=>`<div><b>${esc(q)}</b><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="note">—</li>'}</ul></div>`).join('')}</div>`;
  }else{
    const tc=Object.entries(R.title_checks||{});
    P.innerHTML=`<div class="note">For every script still in production: what people actually search for its brand. If our title uses words from these lists, YouTube search can find it. Checked daily 05:30 PKT.</div>`+
      (tc.length?tc.map(([id,t])=>{const words=new Set(t.title.toLowerCase().match(/[a-z']+/g)||[]);
        return `<div class="rc"><div class="lbl">${esc(id)}</div><div class="t" style="font-size:16px">${esc(t.title)}</div>
        <div class="rsug">${Object.entries(t.suggestions||{}).map(([q,a])=>`<div><b>${esc(q)} …</b><ul>${a.map(x=>{const hit=(x.toLowerCase().match(/[a-z']+/g)||[]).some(w=>w.length>3&&words.has(w)&&!q.includes(w));return `<li class="${hit?'hit':''}">${esc(x)}</li>`}).join('')||'<li class="note">—</li>'}</ul></div>`).join('')}</div>
        <div class="note">Highlighted = shares a word with our title.</div></div>`}).join(''):'<div class="empty">No scripts in production right now.</div>');
  }
}
async function addResearchIdea(t){try{await updateState(st=>{st.ideas=st.ideas||[];if(st.ideas.includes(t))return false;st.ideas.push(t)},'dashboard: idea from research');toast('Added to ideas — Claude will research the true story.');load();renderResearch()}catch(e){toast(e.message,true)}}

// ---------- actions ----------
function toast(t,err){const d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),err?7000:3500)}
function zoom(src){$('#layer').innerHTML=`<div class="zoom" onclick="this.remove()"><img src="${src}"></div>`}
function modal(html){$('#layer').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="box">${html}</div></div>`}
function closeModal(){$('#layer').innerHTML=''}
function askToken(){modal(`<h3>Unlock editing</h3><p>Paste a GitHub fine-grained token for <b>${REPO}</b> with <b>Contents: Read and write</b> (and Actions: Read). It stays only in this browser.</p><input type="password" id="tok" placeholder="github_pat_…"><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveToken()">Unlock</button></div>`);setTimeout(()=>$('#tok').focus(),50)}
async function saveToken(){const t=$('#tok').value.trim();if(!t)return;TOKEN=t;try{const r=await api('');if(!r.permissions||!r.permissions.push)throw new Error('This token cannot write to the repo.');store.set('sd_token',t);closeModal();toast('Editing unlocked.');load()}catch(e){TOKEN=null;toast(e.message,true)}}
function signOut(){TOKEN=null;store.set('sd_token',null);render(true)}
function addNote(j,msg){j.progress=(j.progress||[]).concat([{t:nowIso(),msg}]).slice(-15);j.progress_count=(j.progress_count||0)+1}
const DECIDE_NOTE={script_approved:'✅ Aap ne dashboard se script approve kiya. Claude agle run mein video banana shuru karega.',video_approved:'✅ Aap ne dashboard se video + thumbnail approve kiya. Agle publish slot par YouTube par jayegi.'};
async function decide(id,next){

  S.editing=false;
  try{let ok=false;await updateState(st=>{const j=st.jobs[id];if(!j||!/_(ready|sent)$/.test(j.status))return false;j.status=next;addNote(j,DECIDE_NOTE[next]);j.updated=nowIso();j.decided_via='dashboard';j.decided_at=j.updated;ok=true},`dashboard: ${id} -> ${next}`);
    toast(ok?'Done — Slack gets the same note within a minute.':'Status already changed — refreshed.');load()}catch(e){toast(e.message,true)}}
function askFeedback(id,next,q,isDrop,prefix=''){
  modal(`<h3>${esc(isDrop?'Drop this story':'Your note for Claude')}</h3><p>${esc(q)}</p>${isDrop?'':`<textarea id="fb" rows="5" placeholder="${prefix?'e.g. bigger text, red box, show the swamp':'Be specific: shot number or second, and what to change'}"></textarea>`}<div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${isDrop?'danger':'pri'}" onclick="sendFeedback('${id}','${next}','${prefix}')">${isDrop?'Drop it':'Send to Claude'}</button></div>`);

async function sendFeedback(id,next,prefix){const t=$('#fb')?$('#fb').value.trim():'drop';if(!t)return toast('Write a note first.',true);closeModal();doFeedback(id,next,prefix+t)}
let BUSY=false;
async function doFeedback(id,next,text){

    toast(next==='dropped'?'Dropped.':'Sent. Claude starts on it by '+hm(nextClaudeRun())+' PKT — updates appear here and in Slack.');load()}catch(e){toast(e.message,true)}}

async function addIdea(){S.editing=false;const t=$('#idea').value.trim();if(!t)return;try{await updateState(st=>{st.ideas=st.ideas||[];st.ideas.push(t)},'dashboard: add story idea');toast('Idea queued for Claude.');load()}catch(e){toast(e.message,true)}}
async function dropIdea(i){try{await updateState(st=>{(st.ideas||[]).splice(i,1)},'dashboard: remove story idea');load()}catch(e){toast(e.message,true)}}

try{if(matchMedia('(max-width:900px)').matches)$('#feedwrap').removeAttribute('open')}catch(e){}
load();setInterval(()=>{if(!document.hidden)load()},TOKEN?15000:45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
