name: research
# Research bot (free): YouTube Data API v3 + YouTube search suggestions -> docs/research/latest.json -> dashboard "Research".
# Full scan every day 06:00 PKT (~1,500 of the free 10,000 API units/day): outliers, competitors, trends memory,
# our own videos' growth, title checks. Slack summary only on Mondays (and manual runs) so the channel stays quiet.
# Needs repo secret YT_API_KEY. Never touches jobs, feeds or publishing.
on:
  schedule:
    - cron: '0 1 * * *'     # every day 01:00 UTC = 06:00 PKT: full scan
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = whole research, titles = only title checks'
        default: 'full'
        type: choice
        options: [full, titles]

concurrency:
  group: research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Pick mode
        id: m
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && MODE=full
          SLACK=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then SLACK=yes; fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT; echo "slack=$SLACK" >> $GITHUB_OUTPUT; echo "mode: $MODE slack: $SLACK"

      - name: Run research
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 pipeline/research/research.py --${{ steps.m.outputs.mode }}

      - name: News hooks (long-form topics)
        continue-on-error: true
        run: python3 pipeline/research/news.py

      - name: Save results
        run: |
          git config user.name "research-bot"; git config user.email "research-bot@users.noreply.github.com"
          git add docs/research
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "research: ${{ steps.m.outputs.mode }} $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Tell the owner in Slack
        if: steps.m.outputs.mode == 'full' && steps.m.outputs.slack == 'yes'
        run: |
          [ -f docs/research/summary.txt ] || exit 0
          head -6 docs/research/summary.txt | while IFS= read -r line; do
            [ -n "$line" ] && python3 pipeline/scripts/progress.py research "$line" || true
          done
